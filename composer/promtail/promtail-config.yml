server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 1. Оставляем только контейнеры, у которых есть label с именем compose-сервиса
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        action: keep
      # 2. Устанавливаем label "service" равным имени compose-сервиса
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # 3. Устанавливаем label "container" равным имени контейнера
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'